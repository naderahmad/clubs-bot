# Llama al endpoint de sincronización cada 15 minutos.
# (El cron de Vercel en plan gratuito solo corre una vez al día, por eso usamos GitHub Actions.)
# Configura en GitHub > Settings > Secrets and variables > Actions:
#   APP_URL      → https://tu-app.vercel.app
#   CRON_SECRET  → el mismo valor que en Vercel
name: sync-ea

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar a /api/cron/sync
        run: |
          curl -fsS --max-time 90 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_URL }}/api/cron/sync"
