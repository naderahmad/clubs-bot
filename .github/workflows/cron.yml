# Sincroniza EA → Supabase → Discord cada 15 minutos ejecutando el sync directamente en el runner.
# No pasa por Vercel: Akamai bloquea las IP de Vercel (403), y desde GitHub Actions EA sí responde.
# (Además, el cron de Vercel en plan gratuito solo corre una vez al día.)
#
# Configura en GitHub > Settings > Secrets and variables > Actions > Secrets:
#   SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, DISCORD_BOT_TOKEN, DISCORD_CHANNEL_ID
# Para probar solo EA: pestaña Actions > sync-ea > Run workflow > marcar "dry".
name: sync-ea

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Solo comprobar que EA responde (no toca Supabase ni Discord)"
        type: boolean
        default: false

# Nunca dos sync a la vez (evita tarjetas o mensajes duplicados).
concurrency:
  group: sync-ea
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync
        run: npm run sync -- ${{ inputs.dry && '--dry' || '' }}
        env:
          APP_URL: https://clubs-bot.vercel.app
          EA_CLUB_ID: "621507"
          EA_PLATFORM: common-gen5
          CLUB_UTC_OFFSET: "-04:00"
          LEAVER_THRESHOLD: "0.75"
          SESSION_WINDOW_HOURS: "4"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
