# Diagnóstico manual: comprueba si la API de EA responde desde los runners de GitHub.
name: test-ea

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:ea
        env:
          EA_CLUB_ID: "621507"
          EA_CLUB_NAME: "STARLINK FCX"
          EA_PLATFORM: common-gen5
